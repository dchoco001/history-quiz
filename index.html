<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>초등 5학년 사회 퀴즈 - 찬란한 조선의 문화</title>
  <!-- 눈누 웹폰트: 가독성이 뛰어난 프리텐다드 & 친근한 제목 폰트 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #1e3a8a;       /* 조선 청색/단청 느낌의 선명한 남색 */
      --primary-light: #3b82f6;
      --accent: #f59e0b;        /* 엽전/황금빛 */
      --correct: #059669;       /* 정답 녹색 */
      --correct-bg: #d1fae5;
      --wrong: #dc2626;         /* 오답 빨간색 */
      --wrong-bg: #fee2e2;
      --bg-cream: #faf7f2;      /* 은은한 전통 한지 미색 */
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #4b5563;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: var(--bg-cream);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      line-height: 1.5;
    }

    /* 배경 은은한 격자 패턴 */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: radial-gradient(#d5cebe 1px, transparent 1px);
      background-size: 24px 24px;
      opacity: 0.35;
      z-index: -1;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
    }

    /* 상단 헤더 */
    .quiz-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .badge {
      display: inline-block;
      background: #e0e7ff;
      color: #1e40af;
      font-size: 1.15rem;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 9999px;
      border: 2px solid #c7d2fe;
      margin-bottom: 8px;
    }

    .quiz-title {
      font-family: 'Jua', sans-serif;
      font-size: clamp(2rem, 4.5vw, 3rem);
      color: #1e3a8a;
      letter-spacing: -0.5px;
      text-shadow: 1px 1px 0 #fff;
    }

    /* 메인 퀴즈 카드 */
    .card {
      background: var(--card-bg);
      border-radius: 28px;
      padding: clamp(24px, 4vw, 44px);
      box-shadow: var(--shadow);
      border: 3px solid #e5e0d3;
      position: relative;
      overflow: hidden;
    }

    /* 카드 상단 정보 바 (진행도 + 점수) */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      font-size: clamp(1.1rem, 2.2vw, 1.35rem);
      font-weight: 800;
      color: #475569;
    }

    .step-pill {
      background: #f1f5f9;
      padding: 6px 14px;
      border-radius: 12px;
      color: var(--primary);
    }

    .score-pill {
      color: #b45309;
      background: #fef3c7;
      padding: 6px 14px;
      border-radius: 12px;
    }

    /* 프로그레스 바 */
    .progress-track {
      width: 100%;
      height: 14px;
      background: #e2e8f0;
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 28px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #1d4ed8);
      width: 10%;
      border-radius: 9999px;
      transition: width 0.35s ease;
    }

    /* 질문 텍스트 */
    .question-box {
      margin-bottom: 30px;
    }

    .question-tag {
      font-size: clamp(1.2rem, 2.5vw, 1.5rem);
      font-family: 'Jua', sans-serif;
      color: #2563eb;
      margin-bottom: 6px;
    }

    .question-text {
      font-size: clamp(1.5rem, 3.2vw, 2.2rem);
      font-weight: 800;
      line-height: 1.4;
      color: #0f172a;
      word-break: keep-all;
    }

    /* 보기 목록 (4지선다) */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-bottom: 28px;
    }

    @media (min-width: 680px) {
      .options-grid {
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
    }

    .option-btn {
      background: #ffffff;
      border: 3px solid #cbd5e1;
      border-radius: 20px;
      padding: clamp(16px, 2.5vw, 22px) clamp(16px, 2.5vw, 24px);
      font-size: clamp(1.25rem, 2.4vw, 1.65rem);
      font-weight: 700;
      color: #1e293b;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: all 0.18s ease;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      line-height: 1.35;
      word-break: keep-all;
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      background: #f8fafc;
      border-color: #3b82f6;
      transform: translateY(-2px);
      box-shadow: 0 8px 15px -3px rgba(59, 130, 246, 0.2);
    }

    .option-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .option-num {
      flex-shrink: 0;
      width: clamp(38px, 5vw, 46px);
      height: clamp(38px, 5vw, 46px);
      border-radius: 50%;
      background: #e2e8f0;
      color: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Jua', sans-serif;
      font-size: clamp(1.2rem, 2.5vw, 1.5rem);
      transition: all 0.2s;
    }

    /* 선택 후 상태 스타일 */
    .option-btn.correct {
      border-color: var(--correct);
      background-color: var(--correct-bg);
      color: #065f46;
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.2);
    }

    .option-btn.correct .option-num {
      background-color: var(--correct);
      color: #fff;
    }

    .option-btn.wrong {
      border-color: var(--wrong);
      background-color: var(--wrong-bg);
      color: #991b1b;
      opacity: 0.9;
    }

    .option-btn.wrong .option-num {
      background-color: var(--wrong);
      color: #fff;
    }

    .option-btn:disabled {
      cursor: default;
    }

    /* 피드백 & 해설 박스 */
    .feedback-box {
      border-radius: 20px;
      padding: clamp(18px, 3vw, 26px);
      margin-bottom: 24px;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 3px solid transparent;
      display: none;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.96) translateY(8px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .feedback-box.is-correct {
      display: block;
      background: #ecfdf5;
      border-color: #34d399;
    }

    .feedback-box.is-wrong {
      display: block;
      background: #fff1f2;
      border-color: #f87171;
    }

    .feedback-title {
      font-family: 'Jua', sans-serif;
      font-size: clamp(1.5rem, 3.2vw, 2rem);
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .feedback-box.is-correct .feedback-title {
      color: #047857;
    }

    .feedback-box.is-wrong .feedback-title {
      color: #b91c1c;
    }

    .feedback-desc {
      font-size: clamp(1.2rem, 2.5vw, 1.55rem);
      font-weight: 600;
      color: #1f2937;
      line-height: 1.55;
      word-break: keep-all;
    }

    /* 하단 액션 버튼 */
    .action-container {
      display: flex;
      justify-content: flex-end;
    }

    .btn-next {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      border: none;
      border-radius: 18px;
      padding: clamp(14px, 2.5vw, 18px) clamp(28px, 4vw, 42px);
      font-size: clamp(1.3rem, 2.6vw, 1.7rem);
      font-family: 'Jua', sans-serif;
      cursor: pointer;
      box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s;
    }

    .btn-next:hover {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      transform: translateY(-2px);
      box-shadow: 0 14px 20px -3px rgba(37, 99, 235, 0.4);
    }

    .btn-next:active {
      transform: translateY(0);
    }

    /* 결과 화면 */
    .result-screen {
      display: none;
      text-align: center;
      padding: clamp(20px, 3vw, 36px) 10px;
    }

    .result-screen.active {
      display: block;
      animation: popIn 0.4s ease;
    }

    .result-badge {
      font-size: clamp(3rem, 8vw, 4.5rem);
      margin-bottom: 10px;
    }

    .result-heading {
      font-family: 'Jua', sans-serif;
      font-size: clamp(2.2rem, 5vw, 3.4rem);
      color: var(--primary);
      margin-bottom: 12px;
    }

    .score-circle {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #eff6ff, #dbeafe);
      border: 5px solid #3b82f6;
      border-radius: 36px;
      padding: 24px 44px;
      margin: 20px 0;
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.15);
    }

    .score-num {
      font-family: 'Jua', sans-serif;
      font-size: clamp(3.2rem, 8vw, 5.2rem);
      color: #1d4ed8;
      line-height: 1;
    }

    .score-sub {
      font-size: clamp(1.2rem, 2.5vw, 1.6rem);
      font-weight: 700;
      color: #475569;
      margin-top: 6px;
    }

    .result-message {
      font-size: clamp(1.3rem, 2.8vw, 1.8rem);
      font-weight: 700;
      color: #334155;
      margin-bottom: 34px;
      word-break: keep-all;
      line-height: 1.5;
    }

    .btn-restart {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #ffffff;
      border: none;
      border-radius: 20px;
      padding: clamp(16px, 3vw, 22px) clamp(36px, 6vw, 54px);
      font-size: clamp(1.4rem, 3vw, 1.9rem);
      font-family: 'Jua', sans-serif;
      cursor: pointer;
      box-shadow: 0 10px 18px -3px rgba(245, 158, 11, 0.4);
      display: inline-flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s;
    }

    .btn-restart:hover {
      background: linear-gradient(135deg, #d97706, #b45309);
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 15px 24px -3px rgba(245, 158, 11, 0.45);
    }

    /* 상단 음소거 토글 버튼 */
    .top-controls {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }

    .sound-btn {
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 14px;
      padding: 6px 14px;
      font-size: 1rem;
      font-weight: 700;
      color: #475569;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .sound-btn:hover {
      background: #f1f5f9;
    }

    /* 캔버스 축하 효과 */
    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>
<body>

  <canvas id="confettiCanvas"></canvas>

  <div class="container">
    <!-- 상단 소리 제어 -->
    <div class="top-controls">
      <button class="sound-btn" id="soundToggleBtn" onclick="toggleSound()">
        🔊 효과음 켜짐
      </button>
    </div>

    <!-- 타이틀 영역 -->
    <header class="quiz-header">
      <span class="badge">🏫 초등학교 5학년 사회</span>
      <h1 class="quiz-title">조선 시대 문화 탐험 퀴즈 10문</h1>
    </header>

    <!-- 퀴즈 진행 카드 -->
    <main class="card" id="quizCard">
      <!-- 상태 표시줄 -->
      <div class="status-bar">
        <span class="step-pill" id="stepCounter">문제 1 / 10</span>
        <span class="score-pill" id="currentScore">현재 0점</span>
      </div>

      <!-- 진행 바 -->
      <div class="progress-track" aria-label="진행도">
        <div class="progress-fill" id="progressBar"></div>
      </div>

      <!-- 문제 영역 -->
      <div class="question-box">
        <div class="question-tag" id="questionCategory">💡 [과학과 문화]</div>
        <h2 class="question-text" id="questionText">문제를 불러오는 중입니다...</h2>
      </div>

      <!-- 4지선다 보기 버튼 -->
      <div class="options-grid" id="optionsContainer">
        <!-- 버튼이 스크립트로 렌더링됩니다 -->
      </div>

      <!-- 즉시 정답/오답 해설 박스 -->
      <div class="feedback-box" id="feedbackBox">
        <h3 class="feedback-title" id="feedbackTitle">
          <span id="feedbackIcon">🎉</span> <span id="feedbackStatus">정답입니다!</span>
        </h3>
        <p class="feedback-desc" id="feedbackDesc">해설 내용이 여기에 들어갑니다.</p>
      </div>

      <!-- 다음 버튼 -->
      <div class="action-container" id="actionContainer" style="display: none;">
        <button class="btn-next" id="nextBtn" onclick="goToNextQuestion()">
          <span>다음 문제 풀기</span>
          <span aria-hidden="true">➔</span>
        </button>
      </div>

      <!-- 최종 결과 화면 -->
      <div class="result-screen" id="resultScreen">
        <div class="result-badge" id="resultIcon">🏆</div>
        <h2 class="result-heading">퀴즈 탐험 완료!</h2>
        <div class="score-circle">
          <div class="score-num" id="finalScore">100점</div>
          <div class="score-sub" id="finalDetail">(10문제 중 10문제 정답)</div>
        </div>
        <p class="result-message" id="resultMessage">
          세종대왕님도 칭찬할 조선 문화 박사님이군요!
        </p>
        <button class="btn-restart" onclick="restartQuiz()">
          <span>🔄 처음부터 다시 풀기</span>
        </button>
      </div>
    </main>
  </div>

  <script>
    /* ==========================================================
       초등학교 5학년 사회과 교육과정 연계 조선 시대 문화 10문제
       ========================================================== */
    const quizData = [
      {
        category: "💡 [민족의 문자]",
        question: "1. 세종대왕이 백성들이 글자를 쉽게 배우고 쓸 수 있도록 만든 우리나라 고유의 글자는 무엇일까요?",
        options: ["이두", "향찰", "훈민정음 (한글)", "한자"],
        answer: 2, // 3번째 (0-indexed)
        explanation: "세종대왕은 한자가 어려워 억울한 일을 겪는 백성을 위해 누구나 쉽게 익힐 수 있는 '훈민정음'을 만들었습니다."
      },
      {
        category: "🌧️ [조선의 과학]",
        question: "2. 조선 시대에 비가 내린 양을 정확하게 재기 위해 만든 세계 최초의 강우량 측정 기구는 무엇일까요?",
        options: ["측우기", "혼천의", "앙부일구", "자격루"],
        answer: 0,
        explanation: "측우기는 비의 양을 그릇에 받아 일정하게 측정하는 기구로, 농사에 큰 도움을 준 세계 최초의 우량계입니다."
      },
      {
        category: "☀️ [조선의 과학]",
        question: "3. '가마솥을 받쳐 놓은 모양'의 해시계로, 글을 모르는 백성도 시간을 알 수 있도록 12지신 동물 그림을 그려 넣은 시계는?",
        options: ["자격루", "풍기대", "앙부일구", "수표"],
        answer: 2,
        explanation: "앙부일구는 오목한 솥 모양의 해시계입니다. 백성들을 배려해 동물 그림으로 시간을 쉽게 확인하도록 만들었습니다."
      },
      {
        category: "⏰ [조선의 과학]",
        question: "4. 장영실 등이 만든 물시계로, 햇빛이 없는 밤이나 흐린 날에도 저절로 종과 북을 쳐서 시간을 알려주었던 것은 무엇일까요?",
        options: ["혼의", "자격루", "일구", "간의"],
        answer: 1,
        explanation: "자격루는 물이 차오르면 쇠구슬이 굴러 인형이 종을 치며 시간을 저절로 알려주는 편리한 자동 물시계였습니다."
      },
      {
        category: "🎨 [조선의 예술]",
        question: "5. 조선 후기에 백성들의 일상생활 모습(씨름, 서당, 빨래터 등)을 재미있고 솔직하게 그린 그림을 무엇이라고 부를까요?",
        options: ["풍속화", "산수화", "초상화", "정물화"],
        answer: 0,
        explanation: "서민들의 땀과 웃음, 일상 모습을 생생하게 담아낸 그림을 '풍속화'라고 부릅니다."
      },
      {
        category: "🖌️ [대표적인 화가]",
        question: "6. <씨름>, <서당>, <대장간> 등 조선 후기 서민들의 모습을 익살스럽고 정감 넘치게 그린 대표 화가는 누구일까요?",
        options: ["안견", "신사임당", "김홍도", "정선"],
        answer: 2,
        explanation: "단원 김홍도는 조선 후기를 대표하는 화가로, 백성들의 생생한 삶의 현장을 따뜻한 시선으로 그렸습니다."
      },
      {
        category: "🏰 [과학적인 건축]",
        question: "7. 정조 임금의 명으로 정약용이 만든 도구로, 수원 화성을 지을 때 무거운 돌을 쉽게 들어 올렸던 기계는 무엇일까요?",
        options: ["거중기", "수레", "물레", "해시계"],
        answer: 0,
        explanation: "정약용은 도르래 원리를 이용한 '거중기'를 발명하여 화성을 짓는 데 드는 시간과 비용, 노동력을 크게 줄였습니다."
      },
      {
        category: "🐯 [서민의 그림]",
        question: "8. 조선 시대 백성들이 집안에 걸어두어 나쁜 기운을 물리치고 복을 기원했던, 까치와 호랑이 등이 그려진 그림은?",
        options: ["수묵화", "민화", "궁중기록화", "벽화"],
        answer: 1,
        explanation: "민화는 이름 없는 백성들이 그린 그림으로, 장수와 행복을 바라는 마음과 익살스러운 해학이 담겨 있습니다."
      },
      {
        category: "📖 [서민 문화]",
        question: "9. 허균이 지은 우리나라 최초의 한글 소설로, 신분 차별에 맞서는 영웅의 이야기를 담아 백성들에게 큰 사랑을 받은 책은?",
        options: ["홍길동전", "춘향전", "구운몽", "심청전"],
        answer: 0,
        explanation: "허균의 《홍길동전》은 누구나 읽기 쉬운 한글로 쓰여 서민들에게 큰 인기를 얻은 최초의 한글 소설입니다."
      },
      {
        category: "🏺 [조선의 공예]",
        question: "10. 고려의 대표 도자기가 '청자'라면, 순수하고 담백한 흰 빛깔로 조선의 선비 정신을 잘 보여주는 도자기는?",
        options: ["흑요석", "조선 백자", "신라 토기", "황금잔"],
        answer: 1,
        explanation: "조선 백자는 순백의 단정함과 절제미를 지녀 검소하고 청렴함을 소중히 여긴 조선 선비들의 마음과 잘 어울립니다."
      }
    ];

    /* ==========================================================
       앱 상태 관리 변수
       ========================================================== */
    let currentIdx = 0;
    let score = 0;
    let answered = false;
    let soundEnabled = true;

    /* ==========================================================
       간단한 Web Audio API 사운드 합성기 (외부 파일 없이 작동)
       ========================================================== */
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          audioCtx = new AudioContext();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, duration, type = 'sine', startTime = 0) {
      if (!soundEnabled || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + startTime);
        
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime + startTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + startTime + duration);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start(audioCtx.currentTime + startTime);
        osc.stop(audioCtx.currentTime + startTime + duration);
      } catch (e) {
        console.error(e);
      }
    }

    function playSuccessSound() {
      initAudio();
      // 딩-동-댕 3화음
      playTone(523.25, 0.15, 'triangle', 0.0);   // Do
      playTone(659.25, 0.15, 'triangle', 0.12);  // Mi
      playTone(783.99, 0.35, 'triangle', 0.24);  // Sol
    }

    function playWrongSound() {
      initAudio();
      // 띠-로리 (낮은 톤)
      playTone(330, 0.2, 'sawtooth', 0.0);
      playTone(247, 0.35, 'sawtooth', 0.15);
    }

    function playFanfare() {
      initAudio();
      const notes = [523, 659, 784, 1046];
      notes.forEach((freq, idx) => {
        playTone(freq, 0.25, 'triangle', idx * 0.12);
      });
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById("soundToggleBtn");
      if (soundEnabled) {
        btn.textContent = "🔊 효과음 켜짐";
        btn.style.color = "#475569";
        initAudio();
      } else {
        btn.textContent = "🔇 효과음 꺼짐";
        btn.style.color = "#94a3b8";
      }
    }

    /* ==========================================================
       DOM 엘리먼트 참조
       ========================================================== */
    const stepCounter = document.getElementById("stepCounter");
    const currentScoreEl = document.getElementById("currentScore");
    const progressBar = document.getElementById("progressBar");
    const questionCategory = document.getElementById("questionCategory");
    const questionText = document.getElementById("questionText");
    const optionsContainer = document.getElementById("optionsContainer");
    const feedbackBox = document.getElementById("feedbackBox");
    const feedbackTitle = document.getElementById("feedbackTitle");
    const feedbackIcon = document.getElementById("feedbackIcon");
    const feedbackStatus = document.getElementById("feedbackStatus");
    const feedbackDesc = document.getElementById("feedbackDesc");
    const actionContainer = document.getElementById("actionContainer");
    const nextBtn = document.getElementById("nextBtn");
    const resultScreen = document.getElementById("resultScreen");

    /* ==========================================================
       퀴즈 문제 렌더링
       ========================================================== */
    const optionLabels = ["①", "②", "③", "④"];

    function renderQuestion() {
      answered = false;
      const item = quizData[currentIdx];

      // 상단 진행도 및 점수
      stepCounter.textContent = `문제 ${currentIdx + 1} / ${quizData.length}`;
      currentScoreEl.textContent = `현재 ${score}점`;
      const progressPercent = ((currentIdx + 1) / quizData.length) * 100;
      progressBar.style.width = `${progressPercent}%`;

      // 카테고리 및 질문
      questionCategory.textContent = item.category;
      questionText.textContent = item.question;

      // 보기 생성
      optionsContainer.innerHTML = "";
      item.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerHTML = `
          <span class="option-num">${optionLabels[idx]}</span>
          <span class="option-label">${opt}</span>
        `;
        btn.onclick = () => selectOption(idx);
        optionsContainer.appendChild(btn);
      });

      // 피드백 박스 & 다음 버튼 숨김
      feedbackBox.className = "feedback-box";
      feedbackBox.style.display = "none";
      actionContainer.style.display = "none";

      // 스크롤 상단 이동 (작은 화면에서 편의)
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* ==========================================================
       답안 선택 처리
       ========================================================== */
    function selectOption(selectedIdx) {
      if (answered) return;
      answered = true;
      initAudio();

      const item = quizData[currentIdx];
      const isCorrect = (selectedIdx === item.answer);
      const buttons = optionsContainer.querySelectorAll(".option-btn");

      // 모든 버튼 비활성화 및 스타일 적용
      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === item.answer) {
          btn.classList.add("correct");
        } else if (idx === selectedIdx && !isCorrect) {
          btn.classList.add("wrong");
        }
      });

      // 점수 계산 및 피드백 메시지 설정
      if (isCorrect) {
        score += 10;
        currentScoreEl.textContent = `현재 ${score}점`;
        playSuccessSound();

        feedbackBox.className = "feedback-box is-correct";
        feedbackIcon.textContent = "⭕";
        feedbackStatus.textContent = "정답입니다! 참 잘했어요!";
      } else {
        playWrongSound();
        feedbackBox.className = "feedback-box is-wrong";
        feedbackIcon.textContent = "❌";
        feedbackStatus.textContent = `아쉬워요! 정답은 ${optionLabels[item.answer]}번 (${item.options[item.answer]})입니다.`;
      }

      feedbackDesc.textContent = item.explanation;
      feedbackBox.style.display = "block";

      // 다음 버튼 문구 설정
      if (currentIdx === quizData.length - 1) {
        nextBtn.innerHTML = `<span>최종 결과 확인하기</span> <span aria-hidden="true">🏆</span>`;
      } else {
        nextBtn.innerHTML = `<span>다음 문제 풀기</span> <span aria-hidden="true">➔</span>`;
      }
      actionContainer.style.display = "flex";

      // 약간 스크롤을 내려서 피드백이 시원하게 보이도록 유도
      setTimeout(() => {
        feedbackBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 100);
    }

    /* ==========================================================
       다음 문제로 이동 or 결과 화면 표시
       ========================================================== */
    function goToNextQuestion() {
      if (currentIdx < quizData.length - 1) {
        currentIdx++;
        renderQuestion();
      } else {
        showResults();
      }
    }

    /* ==========================================================
       최종 결과 화면
       ========================================================== */
    function showResults() {
      // 퀴즈 메인 콘텐츠 숨기기
      document.querySelector(".status-bar").style.display = "none";
      document.querySelector(".progress-track").style.display = "none";
      document.querySelector(".question-box").style.display = "none";
      optionsContainer.style.display = "none";
      feedbackBox.style.display = "none";
      actionContainer.style.display = "none";

      // 결과 화면 표시
      resultScreen.classList.add("active");

      const finalScoreEl = document.getElementById("finalScore");
      const finalDetailEl = document.getElementById("finalDetail");
      const resultMessageEl = document.getElementById("resultMessage");
      const resultIconEl = document.getElementById("resultIcon");

      const correctCount = score / 10;
      finalScoreEl.textContent = `${score}점`;
      finalDetailEl.textContent = `(총 10문제 중 ${correctCount}문제 정답!)`;

      if (score === 100) {
        resultIconEl.textContent = "👑";
        resultMessageEl.innerHTML = "와우, 만점이에요! 💯<br>조선의 문화와 과학을 완벽하게 이해하고 있군요!";
        startConfetti();
        playFanfare();
      } else if (score >= 80) {
        resultIconEl.textContent = "🎉";
        resultMessageEl.innerHTML = "대단해요! 아주 훌륭한 실력이에요! 👏<br>조선 시대 역사의 멋진 전문가가 다 되었네요!";
        startConfetti();
        playFanfare();
      } else if (score >= 60) {
        resultIconEl.textContent = "👍";
        resultMessageEl.innerHTML = "잘했어요! 조금만 더 복습하면 만점도 문제없어요! ⭐<br>틀린 문제의 해설을 다시 한 번 확인해 보세요.";
      } else {
        resultIconEl.textContent = "🌱";
        resultMessageEl.innerHTML = "괜찮아요! 조선의 문화를 새롭게 알아가는 중이에요.<br>다시 한 번 풀어보며 실력을 키워볼까요? 💪";
      }
    }

    /* ==========================================================
       다시 풀기 리셋
       ========================================================== */
    function restartQuiz() {
      currentIdx = 0;
      score = 0;
      stopConfetti();

      // 화면 요소들 원상 복구
      document.querySelector(".status-bar").style.display = "flex";
      document.querySelector(".progress-track").style.display = "block";
      document.querySelector(".question-box").style.display = "block";
      optionsContainer.style.display = "grid";
      resultScreen.classList.remove("active");

      renderQuestion();
    }

    /* ==========================================================
       팡파레 꽃가루 애니메이션 (Canvas Confetti)
       ========================================================== */
    const canvas = document.getElementById('confettiCanvas');
    const ctx = canvas.getContext('2d');
    let confettiAnimationId = null;
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function startConfetti() {
      particles = [];
      const colors = ['#f59e0b', '#3b82f6', '#10b981', '#ec4899', '#8b5cf6', '#ef4444'];
      for (let i = 0; i < 90; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          size: Math.random() * 9 + 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: (Math.random() - 0.5) * 4,
          vy: Math.random() * 4 + 3,
          rot: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 8
        });
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.rotSpeed;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rot * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();

          if (p.y > canvas.height) {
            p.y = -10;
            p.x = Math.random() * canvas.width;
          }
        });
        confettiAnimationId = requestAnimationFrame(animate);
      }
      animate();

      // 4초 후 자동 멈춤
      setTimeout(() => {
        stopConfetti();
      }, 4500);
    }

    function stopConfetti() {
      if (confettiAnimationId) {
        cancelAnimationFrame(confettiAnimationId);
        confettiAnimationId = null;
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // 첫 실행
    window.addEventListener("DOMContentLoaded", () => {
      renderQuestion();
    });
  </script>
</body>
</html>
